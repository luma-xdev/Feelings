<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Just Honest Feelings</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:"Segoe UI",Arial,sans-serif;
    color:#e8f6ff;
    overflow-x:hidden;

    background:
        radial-gradient(circle at 15% 10%,rgba(0,140,255,.18),transparent 28%),
        radial-gradient(circle at 85% 25%,rgba(0,90,210,.16),transparent 30%),
        radial-gradient(circle at 50% 100%,rgba(0,210,255,.10),transparent 35%),
        linear-gradient(135deg,#010711,#06172d 48%,#020918);
}


/* ================================
   AMBIENT GLOW
================================ */

body::before{
    content:"";
    position:fixed;

    width:500px;
    height:500px;

    border-radius:50%;

    background:rgba(0,150,255,.08);

    filter:blur(110px);

    top:-220px;
    left:-180px;

    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;

    width:450px;
    height:450px;

    border-radius:50%;

    background:rgba(0,220,255,.06);

    filter:blur(110px);

    bottom:-200px;
    right:-150px;

    pointer-events:none;
}


/* ================================
   STARS
================================ */

.star{
    position:fixed;

    width:3px;
    height:3px;

    border-radius:50%;

    background:#b9ecff;

    opacity:.35;

    animation:
        floating 7s infinite ease-in-out,
        glowing 3s infinite alternate;

    pointer-events:none;
}

.star:nth-child(1){left:8%;top:18%;animation-delay:1s;}
.star:nth-child(2){left:17%;top:73%;animation-delay:3s;}
.star:nth-child(3){left:82%;top:14%;animation-delay:2s;}
.star:nth-child(4){left:91%;top:62%;animation-delay:4s;}
.star:nth-child(5){left:52%;top:8%;animation-delay:5s;}
.star:nth-child(6){left:67%;top:82%;animation-delay:2.5s;}
.star:nth-child(7){left:34%;top:48%;animation-delay:1.5s;}
.star:nth-child(8){left:73%;top:43%;animation-delay:3.5s;}

@keyframes floating{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-18px);
    }
}

@keyframes glowing{

    from{
        opacity:.2;
        box-shadow:0 0 3px #5edcff;
    }

    to{
        opacity:.9;
        box-shadow:
            0 0 8px #45d7ff,
            0 0 18px rgba(40,170,255,.5);
    }
}


/* ================================
   MAIN
================================ */

.container{
    width:min(900px,92%);
    margin:auto;

    padding:90px 0 70px;
}


/* ================================
   INTRO
================================ */

.intro{
    text-align:center;

    margin-bottom:55px;

    animation:fadeUp 1.4s ease;
}

.intro small{

    display:inline-block;

    padding:9px 17px;

    border-radius:30px;

    border:1px solid rgba(80,200,255,.20);

    background:rgba(20,120,190,.08);

    color:#78cbed;

    font-size:10px;

    letter-spacing:4px;

    text-transform:uppercase;

    backdrop-filter:blur(10px);
}

.intro h1{

    margin-top:25px;

    font-size:
        clamp(43px,9vw,78px);

    font-weight:400;

    letter-spacing:-3px;

    color:#eaf8ff;

    text-shadow:
        0 0 30px rgba(30,180,255,.18);
}

.intro h1 span{

    color:#54d9ff;

    text-shadow:
        0 0 18px rgba(60,210,255,.45),
        0 0 50px rgba(30,130,255,.20);
}

.intro p{

    margin-top:18px;

    color:#7694aa;

    font-size:16px;
}


/* ================================
   STORY CARD
================================ */

.story{

    position:relative;

    padding:
        clamp(28px,6vw,55px);

    border-radius:30px;

    background:
        linear-gradient(
            145deg,
            rgba(12,47,82,.68),
            rgba(2,17,37,.78)
        );

    border:
        1px solid rgba(90,205,255,.14);

    box-shadow:
        0 35px 100px rgba(0,0,0,.48),
        inset 0 1px 0 rgba(190,235,255,.05);

    backdrop-filter:blur(25px);

    animation:fadeUp 1.8s ease;
}

.story::before{

    content:"";

    position:absolute;

    top:0;
    left:15%;

    width:70%;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(70,210,255,.65),
            transparent
        );
}


/* ================================
   TEXT
================================ */

.story p{

    font-size:18px;

    line-height:2;

    color:#c8dce8;

    margin-bottom:26px;
}

.highlight{

    color:#67dcff;

    text-shadow:
        0 0 12px rgba(60,205,255,.18);
}


/* ================================
   CENTERED MEMORY / CONFESSION
================================ */

.center-feeling{

    position:relative;

    margin:
        55px
        auto;

    padding:
        38px
        25px;

    max-width:720px;

    text-align:center;

    border-radius:24px;

    background:
        radial-gradient(
            circle at center,
            rgba(0,170,255,.12),
            rgba(2,20,43,.35)
        );

    border:
        1px solid rgba(80,210,255,.18);

    box-shadow:
        0 20px 70px rgba(0,0,0,.35),
        0 0 50px rgba(0,160,255,.06);

    overflow:hidden;
}


/* top little symbol */

.center-feeling::before{

    content:"✦";

    position:absolute;

    top:12px;
    left:50%;

    transform:translateX(-50%);

    color:#58d9ff;

    font-size:13px;

    text-shadow:
        0 0 12px #42d5ff;
}


/* glowing line */

.center-feeling::after{

    content:"";

    position:absolute;

    bottom:0;
    left:20%;

    width:60%;
    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #3bd4ff,
            transparent
        );
}

.center-feeling p{

    margin:0;

    padding-top:10px;

    font-size:
        clamp(17px,3vw,21px);

    line-height:2;

    color:#dff5ff;

    font-weight:400;
}

.center-feeling .blue-text{

    color:#65ddff;

    text-shadow:
        0 0 15px rgba(60,210,255,.30);
}


/* ================================
   DIVIDER
================================ */

.divider{

    width:80px;

    height:1px;

    margin:42px auto;

    background:
        linear-gradient(
            90deg,
            transparent,
            #43cfff,
            transparent
        );

    box-shadow:
        0 0 12px rgba(50,190,255,.3);
}


/* ================================
   FINAL MESSAGE
================================ */

.final-message{

    margin-top:38px;

    padding:
        28px 25px;

    border-radius:18px;

    background:
        linear-gradient(
            135deg,
            rgba(25,115,170,.10),
            rgba(0,35,75,.25)
        );

    border-left:
        2px solid #47d5ff;

    box-shadow:
        inset 0 0 30px rgba(30,170,255,.025);
}

.final-message p{

    margin:0;

    font-size:19px;

    line-height:1.95;

    color:#d9edf8;
}


/* ================================
   END
================================ */

.ending{

    text-align:center;

    margin-top:70px;

    animation:fadeUp 2.4s ease;
}

.ending .symbol{

    font-size:25px;

    color:#61dfff;

    margin-bottom:22px;

    text-shadow:
        0 0 15px rgba(70,210,255,.5);
}

.ending h2{

    font-size:30px;

    font-weight:400;

    color:#dff6ff;
}

.ending p{

    margin-top:14px;

    color:#668499;

    font-size:15px;
}


/* ================================
   FOOTER
================================ */

.footer{

    margin-top:65px;

    text-align:center;

    color:#456277;

    font-size:11px;

    letter-spacing:3px;
}


/* ================================
   ANIMATION
================================ */

@keyframes fadeUp{

    from{

        opacity:0;

        transform:translateY(35px);
    }

    to{

        opacity:1;

        transform:translateY(0);
    }
}


/* ================================
   MOBILE
================================ */

@media(max-width:600px){

    .container{

        width:90%;

        padding:55px 0 60px;
    }

    .intro{

        margin-bottom:45px;
    }

    .intro h1{

        font-size:45px;

        letter-spacing:-2px;
    }

    .intro small{

        font-size:9px;

        letter-spacing:3px;
    }

    .story{

        padding:25px 20px;

        border-radius:23px;
    }

    .story p{

        font-size:16px;

        line-height:1.9;
    }

    .center-feeling{

        margin:
            45px
            auto;

        padding:
            34px
            18px;
    }

    .center-feeling p{

        font-size:16.5px;

        line-height:1.9;
    }

    .final-message{

        padding:22px 18px;
    }

    .final-message p{

        font-size:17px;

        line-height:1.85;
    }

    .ending h2{

        font-size:25px;
    }
}

</style>
</head>

<div class="star"></div>

<div class="star"></div>

<div class="star"></div>
<div class="star"></div>

</body>
